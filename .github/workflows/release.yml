name: Release APK

# Builds a signed release APK for a version tag and attaches it, with its
# SHA-256, to a GitHub Release. The signing keystore lives only in repository
# secrets (see README "Releasing"); nothing secret is committed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SOULACY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SOULACY_KEYSTORE_BASE64 is not set; refusing to publish an unsigned APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SOULACY_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          SOULACY_KEYSTORE_PASSWORD: ${{ secrets.SOULACY_KEYSTORE_PASSWORD }}
          SOULACY_KEY_ALIAS: ${{ secrets.SOULACY_KEY_ALIAS }}
          SOULACY_KEY_PASSWORD: ${{ secrets.SOULACY_KEY_PASSWORD }}
          SOULACY_FCM_PROJECTID: ${{ vars.SOULACY_FCM_PROJECTID }}
          SOULACY_FCM_APPLICATIONID: ${{ vars.SOULACY_FCM_APPLICATIONID }}
          SOULACY_FCM_APIKEY: ${{ vars.SOULACY_FCM_APIKEY }}
          SOULACY_FCM_SENDERID: ${{ vars.SOULACY_FCM_SENDERID }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./gradlew --console=plain :app:testDebugUnitTest :app:assembleRelease \
            -Psoulacy.versionName="$version" -Psoulacy.versionCode="${{ github.run_number }}"
          # A fixed asset name keeps the public link stable:
          # releases/latest/download/soulacy-android.apk always serves the newest release.
          apk="soulacy-android.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # Runners ship several build-tools versions; use the newest apksigner.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner"
          "$apksigner" verify --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "APK=$apk" >> "$GITHUB_ENV"
      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
